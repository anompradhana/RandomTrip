name: Build RandomTrip APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Extract RandomTrip source
        run: |
          unzip -q RandomTrip_v0.2_cloudbuild.zip -d randomtrip_source
          cd randomtrip_source
          flutter create --platforms=android --project-name randomtrip .
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RandomTrip-release
          path: randomtrip_source/build/app/outputs/flutter-apk/app-release.apk
